<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pari Footwear | KD Road, Khalari</title>
<style>
:root{--gold:#c89b3c;--dark:#171717;--cream:#fffaf0}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:#222}
header{background:linear-gradient(135deg,#111,#3b2a0e);color:#fff;padding:22px 16px;text-align:center}
.logo{width:90px;height:90px;border-radius:18px;object-fit:cover;background:#fff;padding:4px}
h1{margin:8px 0 4px;color:#e5bd64;letter-spacing:1px}.sub{margin:0;color:#eee}
nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}
nav button{border:1px solid #c89b3c;background:#fff8e8;border-radius:20px;padding:9px 15px;white-space:nowrap}
.controls{padding:16px;display:flex;gap:10px;flex-wrap:wrap}.controls input,.controls select{padding:12px;border:1px solid #ddd;border-radius:10px;flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding:0 16px 30px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px #0001}.card img{width:100%;height:150px;object-fit:cover;background:#f3f3f3}.info{padding:12px}.price{font-weight:bold;color:#9b701e;font-size:18px}.sizes span{display:inline-block;padding:4px 7px;margin:3px;border:1px solid #ddd;border-radius:6px;font-size:12px}.wa{display:block;text-align:center;margin-top:10px;padding:9px;background:#1f9d55;color:white;text-decoration:none;border-radius:8px}
footer{text-align:center;background:#171717;color:#fff;padding:24px}.empty{text-align:center;padding:30px;color:#777}
</style>
</head>
<body>
<header>
<img class="logo" src="assets/logo.jpg" alt="Pari Footwear Logo">
<h1>PARI FOOTWEAR</h1><p class="sub">KD Road, Khalari, Ranchi, Jharkhand</p>
</header>
<nav id="cats">
<button onclick="setCat('All')">All</button><button onclick="setCat('Men')">Men</button>
<button onclick="setCat('Women')">Women</button><button onclick="setCat('Kids')">Kids</button>
<button onclick="setCat('Sports')">Sports</button>
</nav>
<div class="controls">
<input id="search" placeholder="Product search..." oninput="render()">
<select id="size" onchange="render()"><option value="">All Sizes</option></select>
</div>
<div id="products" class="grid"></div>
<footer>
<b>PARI FOOTWEAR</b><br>KD Road, Khalari, Ranchi, Jharkhand<br>
WhatsApp: <a style="color:#e5bd64" href="https://wa.me/919523275559">9523275559</a>
</footer>
<script>
const products = [
 {name:"Men's Sports Shoe",category:"Men",price:"₹1499",sizes:["6","7","8","9","10"],image:"https://alncuvhcdovjxmydxviv.supabase.co/storage/v1/object/public/PRODUCT-IMAGES/WhatsApp%20Image%202026-08-18%20at%204.05.34%20PM.jpeg",available:true}
];
let cat="All";
function setCat(c){cat=c;render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase(), s=document.getElementById("size").value;
 let list=products.filter(p=>(cat==="All"||p.category===cat)&&p.name.toLowerCase().includes(q)&&(!s||p.sizes.includes(s)));
 const box=document.getElementById("products");
 box.innerHTML=list.map(p=>`<article class="card">
 <img src="${p.image||'https://via.placeholder.com/500x400?text=Pari+Footwear'}" alt="${p.name}">
 <div class="info"><b>${p.name}</b><p class="price">${p.price}</p>
 <div class="sizes">${p.sizes.map(x=>`<span>${x}</span>`).join("")}</div>
 <a class="wa" href="https://wa.me/919523275559?text=${encodeURIComponent("Pari Footwear me "+p.name+" ke size/price ke baare me poochna hai.")}">WhatsApp Enquiry</a></div></article>`).join("") || '<div class="empty">Product nahi mila.</div>';
}
function fillSizes(){let a=[...new Set(products.flatMap(p=>p.sizes))].sort((a,b)=>Number(a)-Number(b));document.getElementById("size").innerHTML='<option value="">All Sizes</option>'+a.map(x=>`<option>${x}</option>`).join("")}
fillSizes();render();
</script>
</body>
</html>
