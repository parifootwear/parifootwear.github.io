<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pari Footwear | KD Road, Khalari</title>

<style>
:root{
  --gold:#c89b3c;
  --dark:#171717;
  --cream:#fffaf0;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--cream);
  color:#222;
}

header{
  background:linear-gradient(135deg,#111,#3b2a0e);
  color:white;
  padding:22px 16px;
  text-align:center;
}

.logo{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:25px;
  background:white;
}

h1{
  margin:10px 0 2px;
  color:#e5bd64;
  font-family:Georgia,serif;
  font-size:38px;
}

header p{
  margin:0;
  font-family:Georgia,serif;
  font-size:22px;
  font-weight:bold;
}

.categories{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  padding:20px 10px;
  background:white;
  border-bottom:1px solid #ddd;
}

.categories button,
.sizes button{
  border:1px solid #c89b3c;
  background:#fffaf0;
  border-radius:25px;
  padding:12px 25px;
  font-size:18px;
  cursor:pointer;
}

.categories button.active,
.sizes button.selected{
  background:#c89b3c;
  color:white;
}

.controls{
  display:flex;
  gap:15px;
  padding:26px;
  background:var(--cream);
}

#search{
  flex:1;
  padding:18px;
  border:1px solid #ddd;
  border-radius:16px;
  font-size:18px;
}

#size{
  width:46%;
  padding:18px;
  border:1px solid #ddd;
  border-radius:16px;
  font-size:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
  padding:25px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002;
}

.card img{
  width:100%;
  height:380px;
  object-fit:cover;
  display:block;
}

.info{
  padding:20px;
}

.info b{
  font-size:25px;
  font-family:Georgia,serif;
}

.price{
  color:#b8860b;
  font-size:25px;
  font-weight:bold;
  margin:12px 0;
}

.sizes{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:15px 0;
}

.sizes button{
  padding:10px 18px;
  border-radius:10px;
  font-size:17px;
}

.wa{
  display:block;
  text-align:center;
  text-decoration:none;
  background:#25D366;
  color:white;
  padding:14px;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
}

footer{
  background:#171717;
  color:white;
  text-align:center;
  padding:30px 15px;
  font-family:Georgia,serif;
  font-size:20px;
}

footer a{
  color:#e5bd64;
}

@media(max-width:600px){
  h1{font-size:32px}
  header p{font-size:18px}
  .controls{padding:20px 15px}
  .grid{padding:15px}
  .card img{height:auto}
  #size{width:45%}
}
</style>
</head>

<body>

<header>
  <img class="logo" src="assets/logo.jpg" alt="Pari Footwear">
  <h1>PARI FOOTWEAR</h1>
  <p>KD Road, Khalari, Ranchi, Jharkhand</p>
</header>

<div class="categories">
  <button onclick="setCat('All')" class="active">All</button>
  <button onclick="setCat('Men')">Men</button>
  <button onclick="setCat('Women')">Women</button>
  <button onclick="setCat('Kids')">Kids</button>
  <button onclick="setCat('Sports')">Sports</button>
</div>

<div class="controls">
  <input id="search" type="text" placeholder="Product search..." oninput="render()">

  <select id="size" onchange="render()">
    <option value="">All Sizes</option>
  </select>
</div>

<div id="products" class="grid"></div>

<footer>
  <b>PARI FOOTWEAR</b><br>
  KD Road, Khalari, Ranchi, Jharkhand<br>
  WhatsApp:
  <a href="https://wa.me/919523275559">9523275559</a>
</footer>

<script>

const products = [
  {
    name:"Men's Sports Shoe",
    category:"Men",
    price:"₹1499",
    sizes:["6","7","8","9","10"],
    image:"https://via.placeholder.com/600x600?text=Pari+Footwear"
  }
];

let cat="All";
let selectedSize="";

function setCat(c){
  cat=c;

  document.querySelectorAll(".categories button").forEach(btn=>{
    btn.classList.remove("active");
    if(btn.textContent===c){
      btn.classList.add("active");
    }
  });

  render();
}

function selectSize(size,button){
  selectedSize=size;

  document.querySelectorAll(".sizes button").forEach(btn=>{
    btn.classList.remove("selected");
  });

  button.classList.add("selected");
}

function fillSizes(){
  const select=document.getElementById("size");

  const allSizes=[...new Set(
    products.flatMap(p=>p.sizes)
  )];

  select.innerHTML='<option value="">All Sizes</option>';

  allSizes.forEach(size=>{
    const option=document.createElement("option");
    option.value=size;
    option.textContent=size;
    select.appendChild(option);
  });
}

function sendWhatsApp(name,price){
  const size=selectedSize || "Size select nahi kiya";

  const message=
    `Pari Footwear me ${name} ke size ${size} aur price ${price} ke baare me poochna hai.`;

  window.location.href=
    "https://wa.me/919523275559?text="+
    encodeURIComponent(message);
}

function render(){

  const q=document.getElementById("search").value
    .toLowerCase()
    .trim();

  const s=document.getElementById("size").value;

  const list=products.filter(p=>
    (cat==="All" || p.category===cat) &&
    p.name.toLowerCase().includes(q) &&
    (!s || p.sizes.includes(s))
  );

  const box=document.getElementById("products");

  box.innerHTML=list.map(p=>`
    <article class="card">

      <img
        src="${p.image}"
        alt="${p.name}"
        onerror="this.src='https://via.placeholder.com/600x600?text=Pari+Footwear'"
      >

      <div class="info">

        <b>${p.name}</b>

        <p class="price">${p.price}</p>

        <div class="sizes">
          ${p.sizes.map(x=>`
            <button
              type="button"
              onclick="selectSize('${x}',this)">
              ${x}
            </button>
          `).join("")}
        </div>

        <a
          class="wa"
          href="#"
          onclick="sendWhatsApp('${p.name}','${p.price}');return false;">
          WhatsApp Enquiry
        </a>

      </div>
    </article>
  `).join("");
}

fillSizes();
render();

</script>

</body>
</html>
